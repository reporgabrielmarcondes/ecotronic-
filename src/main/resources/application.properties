# Escuta em todas as interfaces (necessário para o celular acessar pelo Wi-Fi). PORT é definido por hospedagens como Render/Railway.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---------------- Banco de dados ----------------
# Padrão: H2 em arquivo (./data/ecotronic.mv.db) — não precisa instalar nada.
# Em produção defina DB_URL / DB_USER / DB_PASSWORD (ex.: PostgreSQL gratuito do Render, Neon, Railway).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ecotronic;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 (somente acessível pela própria máquina): http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE:true}

# --- Para usar PostgreSQL, comente as 3 linhas do H2 acima e descomente: ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/ecotronic
# spring.datasource.username=postgres
# spring.datasource.password=sua_senha
# spring.h2.console.enabled=false

